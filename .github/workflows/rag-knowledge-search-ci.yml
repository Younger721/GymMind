name: RAG Knowledge Search CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  knowledge-search-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Knowledge search unit tests
        run: >
          mvn -f backend/pom.xml -B test
          -Dtest=HybridRetrieverTest,KnowledgeAudienceSearchServiceTest,KnowledgeSearchProgressTest,KnowledgeSearchRerankRetryTest,KnowledgeIndexAudienceFilterTest,SearchQueryEmbeddingCacheTest,IndexGenerationServiceTest,KnowledgeIndexingServiceTest

  rag-eval-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate rag-eval fixtures
        shell: pwsh
        run: ./scripts/rag-eval/validate-eval-fixtures.ps1

  rag-search-only-eval:
    runs-on: ubuntu-latest
    if: ${{ vars.GYMMIND_EVAL_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: SearchOnly eval (no Harness / LLM)
        shell: pwsh
        env:
          GYMMIND_EVAL_BASE_URL: ${{ vars.GYMMIND_EVAL_BASE_URL }}
        run: |
          ./scripts/rag-eval/run-eval.ps1 -BaseUrl $env:GYMMIND_EVAL_BASE_URL -SearchOnly
