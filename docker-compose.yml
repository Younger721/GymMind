services:
  # MySQL 8.0 - 使用本地 MySQL，这里仅作为参考配置保留
  # 实际使用你本地已有的 MySQL 实例
  # mysql:
  #   image: mysql:8.0
  #   container_name: gymmind-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  #     MYSQL_DATABASE: gymmind
  #   ports:
  #     - "${MYSQL_HOST_PORT:-3306}:3306"
  #   command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  # Redis 7 - 缓存和会话存储（复用）
  redis:
    image: redis:7-alpine
    container_name: gymmind-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # Elasticsearch 9.4.2 with 中文分词插件（复用）
  elasticsearch:
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    image: gymmind-elasticsearch:9.4.2-smartcn
    container_name: gymmind-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ES_HOST_PORT:-9202}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # etcd - Milvus 依赖（复用）
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: gymmind-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  # MinIO - 对象存储，Milvus 依赖（复用）
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: gymmind-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"  # API 端口
      - "9001:9001"  # 控制台端口
    volumes:
      - minio_data:/minio_data

  # Milvus v2.4.17 - 向量数据库（复用）
  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: gymmind-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "19530:19530"  # gRPC 端口
      - "9091:9091"    # Metrics 端口
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

volumes:
  # mysql_data:  # 使用本地 MySQL，注释掉
  redis_data:
  es_data:
  etcd_data:
  minio_data:
  milvus_data:
