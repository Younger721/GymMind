# Docker 基础设施 profile：配合 start-infrastructure.bat 使用
# 激活方式：SPRING_PROFILES_ACTIVE=dev,docker
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_HOST_PORT:6379}

gymmind:
  # 会话 Redis 命名空间只用单段环境名，不能直接用 dev,docker
  environment: dev
  # Docker infrastructure supplies Elasticsearch/Milvus/MinIO; MySQL remains local.
  job-queue: ${GYMMIND_JOB_QUEUE:mysql}
  search:
    keyword-backend: ${GYMMIND_SEARCH_KEYWORD_BACKEND:elasticsearch}
    vector-backend: ${GYMMIND_SEARCH_VECTOR_BACKEND:milvus}
    elasticsearch-url: ${GYMMIND_ES_URL:http://localhost:9202}
    milvus-url: ${GYMMIND_MILVUS_URL:http://localhost:19530}
    recover-published: false
  object-store: ${GYMMIND_OBJECT_STORE:minio}
  object-store.minio-endpoint: ${GYMMIND_OBJECT_STORE_MINIO_ENDPOINT:http://localhost:9000}
  object-store.minio-access-key: ${GYMMIND_OBJECT_STORE_MINIO_ACCESS_KEY:minioadmin}
  object-store.minio-secret-key: ${GYMMIND_OBJECT_STORE_MINIO_SECRET_KEY:minioadmin123}
  object-store.minio-bucket: ${GYMMIND_OBJECT_STORE_MINIO_BUCKET:gymmind}
  # MinIO 细项通过环境变量注入（见 .env 中 GYMMIND_OBJECT_STORE_MINIO_*）
