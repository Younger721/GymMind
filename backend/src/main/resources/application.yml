spring:
  application:
    name: gymmind-backend
  profiles:
    default: dev
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info

platform-admin:
  email: ${PLATFORM_ADMIN_EMAIL:}
  username: ${PLATFORM_ADMIN_USERNAME:}
  password: ${PLATFORM_ADMIN_PASSWORD:}

gymmind:
  search:
    recover-published: false
    recover-incomplete-ingest: true
    recover-index-on-start: false
    require-dual-recall: false
    recall-top-k: 30
    fusion-top-k: 20
    max-segments-per-document: 3
    context-budget-chars: 12000
    query-embedding-cache:
      enabled: true
      ttl-seconds: 300
      max-entries: 512
    rerank:
      max-attempts: 2
      retry-base-ms: 200
    lexical:
      long-query-term-threshold: 2
      long-query-min-score: 4
      very-long-query-term-threshold: 6
      very-long-query-min-matches: 4
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat-model: ${DASHSCOPE_CHAT_MODEL:qwen3.8-flash}
      embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
      rerank-model: ${DASHSCOPE_RERANK_MODEL:qwen3.7-text-rerank}
  security:
    jwt:
      issuer: GymMind
      secret: ${JWT_SECRET:GymMind-local-dev-secret-change-me-please-32bytes}
      access-ttl: PT2H
      refresh-ttl: P7D
  rate-limit:
    requests-per-minute: ${GYMMIND_RATE_LIMIT_PER_MINUTE:300}
