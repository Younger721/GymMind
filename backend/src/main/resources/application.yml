spring:
  application:
    name: gymmind-backend
  profiles:
    default: dev
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info

platform-admin:
  email: ${PLATFORM_ADMIN_EMAIL:}
  username: ${PLATFORM_ADMIN_USERNAME:}
  password: ${PLATFORM_ADMIN_PASSWORD:}

gymmind:
  search:
    recover-published: false
    recover-incomplete-ingest: true
    recover-index-on-start: false
    require-dual-recall: false
    recall-top-k: 30
    fusion-top-k: 20
    max-segments-per-document: 3
    context-budget-chars: 12000
    query-embedding-cache:
      enabled: true
      ttl-seconds: 300
      max-entries: 512
    rerank:
      max-attempts: 2
      retry-base-ms: 200
    lexical:
      long-query-term-threshold: 2
      long-query-min-score: 4
      very-long-query-term-threshold: 6
      very-long-query-min-matches: 4
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat-model: ${DASHSCOPE_CHAT_MODEL:qwen3.8-flash}
      embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
      rerank-model: ${DASHSCOPE_RERANK_MODEL:qwen3.7-text-rerank}
      # OCR 专用模型（文档/表格/试卷/手写优化）+ 免费额度用尽时回退的备用模型（额度池独立）
      ocr-model: ${DASHSCOPE_OCR_MODEL:qwen3.5-ocr}
      ocr-fallback-model: ${DASHSCOPE_OCR_FALLBACK_MODEL:qwen3.8-flash}
    # AI 联网搜索工具（function call）：tavily 使用 GitHub 开源 LangChain4j 官方搜索工具，
    # API Key 在 tavily.com 免费注册（1000 次/月）；none 为关闭
    web-search:
      provider: ${AI_WEB_SEARCH_PROVIDER:tavily}
      api-key: ${AI_WEB_SEARCH_API_KEY:}
      max-results: ${AI_WEB_SEARCH_MAX_RESULTS:5}
      timeout-ms: ${AI_WEB_SEARCH_TIMEOUT_MS:8000}
      max-content-chars: ${AI_WEB_SEARCH_MAX_CONTENT_CHARS:6000}
      max-download-bytes: ${AI_WEB_SEARCH_MAX_DOWNLOAD_BYTES:524288}
  security:
    jwt:
      issuer: GymMind
      secret: ${JWT_SECRET:GymMind-local-dev-secret-change-me-please-32bytes}
      access-ttl: PT2H
      refresh-ttl: P7D
  # OCR 识图（M1 同步链路）：上传图片 → qwen3.5-ocr 识别 → Markdown
  ocr:
    enabled: ${OCR_ENABLED:true}
    max-bytes: ${OCR_MAX_BYTES:10485760}
    timeout-ms: ${OCR_TIMEOUT_MS:60000}
    daily-quota-per-tenant: ${OCR_DAILY_QUOTA:200}
    upload-ttl-hours: ${OCR_UPLOAD_TTL_HOURS:24}
  rate-limit:
    requests-per-minute: ${GYMMIND_RATE_LIMIT_PER_MINUTE:300}
