spring:
  application:
    name: gymmind-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gymmind}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds

# AI Configuration
ai:
  openai:
    api-key: ${AI_API_KEY}
    base-url: ${AI_API_BASE_URL:https://api.deepseek.com/v1}
    chat:
      model: deepseek-chat
      temperature: 0.7
      max-tokens: 2000
    embedding:
      model: ${EMBEDDING_MODEL:text-embedding-3-small}

# Elasticsearch Configuration
elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  index:
    knowledge: gymmind_knowledge

# Milvus Configuration
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection:
    knowledge: gymmind_knowledge_vectors
  vector:
    dimension: 1536  # OpenAI text-embedding-3-small dimension
    index-type: HNSW
    metric-type: COSINE

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
  bucket:
    knowledge: gymmind-knowledge

# RAG Configuration
rag:
  retrieval:
    top-k-vector: 10
    top-k-keyword: 10
    final-top-k: 5
    min-score: 0.5
  chunk:
    size: 512
    overlap: 50

# Logging
logging:
  level:
    root: INFO
    com.gymmind: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
