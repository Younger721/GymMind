spring:
  application:
    name: gymmind-backend
  profiles:
    default: dev
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
platform-admin:
  email: ${PLATFORM_ADMIN_EMAIL:}
  password: ${PLATFORM_ADMIN_PASSWORD:}
gymmind:
  security:
    jwt:
      issuer: GymMind
      secret: ${JWT_SECRET:}
      access-ttl: PT15M
      refresh-ttl: P7D
