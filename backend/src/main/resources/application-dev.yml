# 本地全栈开发（唯一推荐 profile：dev）
# 前置：本机 MySQL + start-infrastructure 拉起 Redis/ES/Milvus/MinIO
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/gymmind?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_HOST_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

platform-admin:
  email: ${PLATFORM_ADMIN_EMAIL:admin@gymmind.local}
  username: ${PLATFORM_ADMIN_USERNAME:admin}
  password: ${PLATFORM_ADMIN_PASSWORD:123456}
  force-password-sync: ${PLATFORM_ADMIN_FORCE_PASSWORD_SYNC:false}

gymmind:
  environment: dev
  dev:
    reset-demo-password: ${GYMMIND_RESET_DEMO_PASSWORD:false}
  job-queue: redis
  object-store: minio
  object-store.minio-endpoint: ${GYMMIND_OBJECT_STORE_MINIO_ENDPOINT:http://localhost:9000}
  object-store.minio-access-key: ${GYMMIND_OBJECT_STORE_MINIO_ACCESS_KEY:minioadmin}
  object-store.minio-secret-key: ${GYMMIND_OBJECT_STORE_MINIO_SECRET_KEY:minioadmin123}
  object-store.minio-bucket: ${GYMMIND_OBJECT_STORE_MINIO_BUCKET:gymmind}
  search:
    keyword-backend: elasticsearch
    vector-backend: milvus
    elasticsearch-url: ${GYMMIND_ES_URL:http://localhost:9202}
    milvus-url: ${GYMMIND_MILVUS_URL:http://localhost:19530}
    recover-published: ${GYMMIND_SEARCH_RECOVER_PUBLISHED:true}
  knowledge:
    ingest:
      two-phase: ${GYMMIND_KNOWLEDGE_INGEST_TWO_PHASE:true}
      max-attempts: ${GYMMIND_KNOWLEDGE_INGEST_MAX_ATTEMPTS:5}
      retry-base-seconds: ${GYMMIND_KNOWLEDGE_INGEST_RETRY_BASE_SECONDS:30}
      lease-minutes: ${GYMMIND_KNOWLEDGE_INGEST_LEASE_MINUTES:5}
  ai:
    harness:
      platform-default-plugins: basic_chat,knowledge_search
      tenant-default-plugins: basic_chat,knowledge_search
      default-system-prompt: 你是 GymMind 智能健身助手，回答要专业、简洁、安全，不要编造不存在的服务。
